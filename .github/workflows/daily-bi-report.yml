name: Automated Daily Executive BI Report Dispatch

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force dispatch even if already sent today'
        required: false
        default: 'false'
        type: boolean

jobs:
  generate-and-send-report:
    runs-on: ubuntu-latest
    name: Generate Vector PDF & Email Dispatch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer with Chromium
        run: npx puppeteer browsers install chrome

      - name: Build Next.js Static Export
        run: npm run build
        env:
          # Set these in Settings -> Secrets and variables -> Actions. No literal fallback here -
          # a hardcoded fallback meant this workflow kept using a leaked key even after rotation.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Start local report preview server
        run: |
          npx serve out -l 3000 &
          sleep 4

      - name: Execute Headless Chrome PDF Generation & Dispatch
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            node scripts/dispatch_scheduled_report.mjs --force
          else
            node scripts/dispatch_scheduled_report.mjs
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TARGET_REPORT_URL: 'http://127.0.0.1:3000/?pdf_modal=1&tab=preview'
