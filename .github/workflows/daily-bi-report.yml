name: Automated Daily Executive BI Report Dispatch

on:
  schedule:
    # 05:30 AM Asia/Vientiane (UTC+7) is 22:30 UTC of previous day
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force dispatch even if already sent today'
        required: false
        default: 'false'
        type: boolean

jobs:
  generate-and-send-report:
    runs-on: ubuntu-latest
    name: Generate Vector PDF & Email Dispatch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer with Chromium
        run: npm install puppeteer

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Start local report preview server
        run: |
          npx serve out -l 3000 &
          sleep 3

      - name: Execute Headless Chrome PDF Generation & Dispatch
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            node scripts/dispatch_scheduled_report.mjs --force
          else
            node scripts/dispatch_scheduled_report.mjs
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          TARGET_REPORT_URL: 'http://127.0.0.1:3000/?pdf_modal=1&tab=preview'
